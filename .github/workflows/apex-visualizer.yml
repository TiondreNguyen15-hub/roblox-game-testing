name: Windows build and smoke test
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S apex-visualizer -B build-apex -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build build-apex --config Release --parallel 2
      - name: Module tests
        run: ctest --test-dir build-apex -C Release --output-on-failure
      - name: DX11 WARP smoke tests
        shell: pwsh
        run: |
          foreach ($mode in @('--smoke-test', '--async-smoke-test')) {
          $p = Start-Process -FilePath './build-apex/Release/apex_visualizer.exe' -ArgumentList $mode,'--json','apex-visualizer/apex_entities.json' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Smoke test timed out' }
          if ($p.ExitCode -ne 0) { if (Test-Path "$env:LOCALAPPDATA/ApexVisualization/apex.log") { Get-Content "$env:LOCALAPPDATA/ApexVisualization/apex.log" }; throw "Smoke test failed: $($p.ExitCode)" }
          Get-Content smoke-result.txt
          }
      - name: External recording through real DX11 preview
        shell: pwsh
        run: |
          $p = Start-Process './build-apex/Release/apex_visualizer.exe' -ArgumentList '--capture-test','./apex-visualizer/tests/fixtures/capture-test.mp4' -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'Capture preview integration timed out' }
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA/ApexVisualization/apex.log" -Tail 50; throw "Capture preview failed: $($p.ExitCode)" }
          Get-Content capture-smoke-result.txt
      - name: Recorded HUD text through actual OCR and DX11 UI
        shell: pwsh
        run: |
          $p = Start-Process './build-apex/Release/apex_visualizer.exe' -ArgumentList '--hud-test','./apex-visualizer/tests/fixtures/hud-counter.mp4' -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'Recorded HUD OCR integration timed out' }
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA/ApexVisualization/apex.log" -Tail 60; throw "Actual HUD OCR integration failed: $($p.ExitCode)" }
          Get-Content hud-smoke-result.txt
          Get-Content hud-readings-test.csv
      - name: Enemy adapter pixel-to-ONNX-to-preview integration (synthetic contract fixture)
        shell: pwsh
        run: |
          $p = Start-Process './build-apex/Release/apex_visualizer.exe' -ArgumentList '--enemy-test','./apex-visualizer/tests/fixtures/hud-counter.mp4','--enemy-model','./apex-visualizer/tests/fixtures/enemy-contract-test.onnx' -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'Enemy contract integration timed out' }
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA/ApexVisualization/apex.log" -Tail 60; throw "Enemy adapter integration failed: $($p.ExitCode)" }
          $result = Get-Content enemy-smoke-result.txt -Raw
          if ($result -notmatch 'count=1;' -or $result -notmatch 'CUDA_verified=0') { throw 'Contract fixture output/backend was not verified honestly' }
          Write-Host $result
      - name: Actual official OBS virtual-camera filter and DX11 preview
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'obs-official-33.0.1.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'obs-official-camera'
          Invoke-WebRequest 'https://github.com/obsproject/obs-studio/releases/download/33.0.1/OBS-Studio-33.0.1-Windows-x64.zip' -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '0d9436451c2d772b33428e3fdae9776f071895c335de17283176306fb72651d3') { throw 'Official OBS archive SHA256 mismatch' }
          Expand-Archive $archive $folder
          $camera = Get-ChildItem $folder -Recurse -Filter 'obs-virtualcam-module64.dll' | Select-Object -First 1
          if (!$camera) { throw 'Official OBS virtual-camera component missing' }
          $registration = Start-Process "$env:SystemRoot/System32/regsvr32.exe" -ArgumentList '/i','/s',('"'+$camera.FullName+'"') -Wait -PassThru
          if ($registration.ExitCode -ne 0) { throw "Official camera registration failed: $($registration.ExitCode)" }
          try {
            [ordered]@{ official_release='33.0.1'; archive_sha256=$hash; camera_dll_sha256=(Get-FileHash $camera.FullName -Algorithm SHA256).Hash; obs_application_started=$false; expected_video='Actual official camera placeholder frames; not gameplay' } | ConvertTo-Json | Set-Content obs-camera-provenance.json
            $p = Start-Process './build-apex/Release/apex_visualizer.exe' -ArgumentList '--capture-camera-test' -PassThru
            if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'Official OBS camera test timed out' }
            if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA/ApexVisualization/apex.log" -Tail 70; throw "Actual OBS camera test failed: $($p.ExitCode)" }
            Get-Content obs-camera-smoke-result.txt
          } finally {
            Start-Process "$env:SystemRoot/System32/regsvr32.exe" -ArgumentList '/u','/s',('"'+$camera.FullName+'"') -Wait
          }
      - name: Desktop overlay continues actual capture and inference while minimized
        shell: pwsh
        run: |
          $p = Start-Process './build-apex/Release/apex_visualizer.exe' -ArgumentList '--overlay-background-test','--enemy-model','./apex-visualizer/tests/fixtures/enemy-contract-test.onnx' -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'Desktop overlay background test timed out' }
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA/ApexVisualization/apex.log" -Tail 40; throw 'Minimized overlay integration failed' }
          Get-Content overlay-background-result.txt
      - name: Five-minute startup recovery and missing custom-model diagnostics
        shell: pwsh
        run: |
          $model = './build-apex/Release/models/compute_validation.onnx'
          $hash = (Get-FileHash $model -Algorithm SHA256).Hash.ToLower()
          Move-Item $model ($model+'.saved')
          try {
            $p = Start-Process './build-apex/Release/apex_visualizer.exe' -ArgumentList '--gpu-soak','--cpu-seconds','1','--compute-iterations','5','--warp','--output','./compute-model-recovery' -PassThru
            if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'Recovered-model startup timed out' }
            if ($p.ExitCode -ne 6) { throw 'Expected required-GPU unavailability on WARP, not a fake GPU pass' }
            $r = Get-Content ./compute-model-recovery/compute-report.json -Raw | ConvertFrom-Json
            if (!$r.cpu_inference.verified -or $r.gpu_target_seconds -ne 300 -or $r.cuda_ep_inference.verified -or $r.selected_model.sha256 -ne $hash -or (Get-FileHash $model -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw 'Bundled model was not recovered and numerically verified for actual soak startup' }
          } finally { if (Test-Path $model) { Remove-Item $model }; Move-Item ($model+'.saved') $model }
          $p = Start-Process './build-apex/Release/apex_visualizer.exe' -ArgumentList '--gpu-soak','--model','./intentionally-missing-custom.onnx','--warp','--output','./compute-model-missing' -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'Missing model diagnostic test timed out' }
          if ($p.ExitCode -ne 6) { throw 'Missing custom model should not pass' }
          $r = Get-Content ./compute-model-missing/compute-report.json -Raw | ConvertFrom-Json
          if ($r.cuda_workload.reason_code -ne 'MODEL_FILE_MISSING' -or $r.cuda_workload.state -ne 'blocked' -or !$r.error -or $r.acceleration_status -notmatch 'MODEL_FILE_MISSING' -or $r.cuda_ep_inference.verified) { throw 'Missing-model startup error hidden or falsely verified' }
      - name: Timed WARP stability benchmark (120 seconds)
        shell: pwsh
        run: |
          ./apex-visualizer/tools/benchmark.ps1 -Exe ./build-apex/Release/apex_visualizer.exe -Output ./hardware-validation -Seconds 120 -Warmup 5 -Warp
      - name: Actual CPU ONNX inference and CUDA unavailable handling
        shell: pwsh
        run: |
          ./apex-visualizer/tools/compute-benchmark.ps1 -Exe ./build-apex/Release/apex_visualizer.exe -Output ./compute-validation -Seconds 60 -Warp
          $report = Get-Content (Get-ChildItem compute-validation -Recurse -Filter compute-report.json | Select-Object -First 1).FullName -Raw | ConvertFrom-Json
          if (-not $report.cpu_inference.verified -or $report.cuda_workload.verified -or $report.cuda_ep_inference.verified) { throw 'Unexpected compute verification state on WARP runner' }
      - name: Selected-model benchmark and input-shape recovery
        shell: pwsh
        run: |
          ./apex-visualizer/tools/model-benchmark.ps1 -Exe ./build-apex/Release/apex_visualizer.exe -Model ./apex-visualizer/tests/fixtures/dynamic-relu.onnx -InputProfile ./apex-visualizer/tests/fixtures/dynamic-shapes.json -CpuSeconds 3 -GpuSeconds 2 -Output ./model-benchmark-validation -Warp
          $report = Get-Content (Get-ChildItem model-benchmark-validation -Recurse -Filter compute-report.json | Select-Object -First 1).FullName -Raw | ConvertFrom-Json
          $hash = (Get-FileHash ./apex-visualizer/tests/fixtures/dynamic-relu.onnx -Algorithm SHA256).Hash.ToLower()
          if (!$report.selected_model.benchmark_mode -or $report.selected_model.sha256 -ne $hash -or !$report.cpu_inference.verified -or $report.cpu_inference.validated_loop_duration_s -lt 3 -or $report.cuda_ep_inference.verified) { throw 'Selected-model benchmark reported incorrect identity/execution' }
          $p = Start-Process './build-apex/Release/apex_visualizer.exe' -ArgumentList '--model-benchmark','--model','./apex-visualizer/tests/fixtures/dynamic-relu.onnx','--cpu-seconds','1','--gpu-seconds','1','--warp','--output','./model-shape-negative' -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'Missing input-shape test timed out' }
          if ($p.ExitCode -ne 6) { throw 'Missing dynamic dimensions were not rejected' }
          $r = Get-Content ./model-shape-negative/compute-report.json -Raw | ConvertFrom-Json
          if ($r.cpu_inference.reason_code -ne 'INPUT_SHAPE_REQUIRED' -or $r.cpu_inference.verified) { throw 'Dynamic shape omission falsely verified' }
      - name: Verify optional GPU runtime installer (not a GPU execution test)
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'apex-ort-gpu-install'
          ./apex-visualizer/tools/setup-gpu-runtime.ps1 -Destination $dest -InstallDependencies
          & './build-apex/Release/apex_dependency_tests.exe' $dest 2>&1 | Tee-Object dependency-loader-test.txt
          if ($LASTEXITCODE -eq 77) { Write-Host 'Provider initialization explicitly BLOCKED by unavailable NVIDIA driver; not GPU success'; $global:LASTEXITCODE = 0 } elseif ($LASTEXITCODE -ne 0) { throw 'Actual CUDA dependency DLL loading failed (not a GPU execution test)' }
          Move-Item (Join-Path $dest 'cudnn_graph64_9.dll') (Join-Path $dest 'cudnn_graph64_9.dll.disabled')
          try {
            $p = Start-Process './build-apex/Release/apex_dependency_tests.exe' -ArgumentList $dest -PassThru -RedirectStandardError missing-cudnn-component.txt
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Missing-companion test timeout' }
            if ($p.ExitCode -ne 1 -or (Get-Content missing-cudnn-component.txt -Raw) -notmatch 'cudnn_graph64_9.dll: missing') { throw 'Missing cuDNN component was not rejected cleanly before dispatcher use' }
          } finally { Move-Item (Join-Path $dest 'cudnn_graph64_9.dll.disabled') (Join-Path $dest 'cudnn_graph64_9.dll') }
          Get-ChildItem $dest -Filter '*.dll' | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content gpu-runtime-install-manifest.json
          Remove-Item $dest -Recurse -Force
      - name: Required CUDA must fail without CUDA hardware
        shell: pwsh
        run: |
          $p = Start-Process './build-apex/Release/apex_visualizer.exe' -ArgumentList '--compute-test','--compute-iterations','5','--require-cuda','--warp','--output','./compute-required-negative' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Negative CUDA test timeout' }
          if ($p.ExitCode -ne 6) { throw "Expected unverified CUDA exit 6, got $($p.ExitCode)" }
      - name: Cancelled compute must fail
        shell: pwsh
        run: |
          $p = Start-Process './build-apex/Release/apex_visualizer.exe' -ArgumentList '--compute-test','--compute-seconds','30','--compute-cancel-after','1','--warp','--output','./compute-cancelled' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Cancelled run timeout' }
          if ($p.ExitCode -ne 6) { throw "Expected cancelled exit 6, got $($p.ExitCode)" }
          $report = Get-Content ./compute-cancelled/compute-report.json -Raw | ConvertFrom-Json
          if ($report.phase -ne 'cancelled' -or $report.cuda_ep_inference.verified) { throw 'Cancelled run falsely completed' }
      - name: Missing runtime recovery
        shell: pwsh
        run: |
          Move-Item ./build-apex/Release/runtime ./build-apex/Release/runtime-disabled
          try {
          $p = Start-Process './build-apex/Release/apex_visualizer.exe' -ArgumentList '--compute-test','--compute-iterations','5','--warp','--output','./compute-missing-runtime' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Missing runtime test timeout' }
          if ($p.ExitCode -ne 6) { throw "Expected unavailable inference exit 6, got $($p.ExitCode)" }
          $report = Get-Content ./compute-missing-runtime/compute-report.json -Raw | ConvertFrom-Json
          if ($report.cpu_inference.state -ne 'unavailable' -or $report.cuda_ep_inference.verified) { throw 'Missing runtime falsely verified' }
          } finally { Move-Item ./build-apex/Release/runtime-disabled ./build-apex/Release/runtime }
      - uses: actions/upload-artifact@v5
        with:
          name: apex-visualizer-windows
          path: |
            build-apex/Release/*.exe
            build-apex/Release/runtime/
            build-apex/Release/models/
            smoke-result.txt
            capture-smoke-result.txt
            obs-camera-smoke-result.txt
            enemy-smoke-result.txt
            overlay-background-result.txt
            hud-smoke-result.txt
            hud-readings-test.csv
            obs-camera-provenance.json
            hardware-validation/
            compute-validation/
            model-benchmark-validation/
            model-shape-negative/
            compute-model-recovery/
            compute-model-missing/
            gpu-runtime-install-manifest.json
            dependency-loader-test.txt
            missing-cudnn-component.txt
            compute-required-negative/
            compute-missing-runtime/
            compute-cancelled/
          if-no-files-found: error
